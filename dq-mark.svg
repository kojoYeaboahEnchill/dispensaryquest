<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="32%" cy="24%" r="92%">
      <stop offset="0" stop-color="#17927A"/>
      <stop offset=".45" stop-color="#0B5E4F"/>
      <stop offset="1" stop-color="#042A23"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE7A1"/>
      <stop offset=".35" stop-color="#E7B64C"/>
      <stop offset=".62" stop-color="#B8801F"/>
      <stop offset="1" stop-color="#F4D27A"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5C12"/>
      <stop offset="1" stop-color="#E9C062"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F3EDE1"/>
      <stop offset="1" stop-color="#CFC6B4"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0584C"/>
      <stop offset=".55" stop-color="#C42A22"/>
      <stop offset="1" stop-color="#7E1410"/>
    </linearGradient>
    <pattern id="kente" width="128" height="128" patternUnits="userSpaceOnUse" patternTransform="rotate(45 512 512)">
      <rect x="0" y="0" width="64" height="20" fill="#F4D27A"/>
      <rect x="64" y="64" width="64" height="20" fill="#F4D27A"/>
      <rect x="20" y="28" width="24" height="24" fill="#F4D27A"/>
      <rect x="84" y="92" width="24" height="24" fill="#F4D27A"/>
      <rect x="96" y="8" width="8" height="48" fill="#F4D27A"/>
      <rect x="32" y="72" width="8" height="48" fill="#F4D27A"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#021712" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#021712" flood-opacity=".5"/>
    </filter>
    <clipPath id="cap"><rect x="-300" y="-92" width="600" height="184" rx="92"/></clipPath>
  </defs>

  <!-- emerald field with a faint kente weave -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#kente)" opacity=".07"/>
  <rect width="1024" height="1024" fill="url(#vig)"/>

  <!-- compass: gold ring, inner hairline, points -->
  <g filter="url(#soft)">
    <circle cx="512" cy="512" r="318" fill="none" stroke="url(#gold)" stroke-width="34"/>
    <circle cx="512" cy="512" r="318" fill="none" stroke="url(#goldEdge)" stroke-width="34" stroke-opacity=".25"/>
    <circle cx="512" cy="512" r="272" fill="none" stroke="#F4D27A" stroke-opacity=".55" stroke-width="5"/>
    <!-- cardinal points -->
    <path d="M512 104 L548 196 L512 178 L476 196 Z" fill="url(#gold)"/>
    <path d="M920 512 L828 548 L846 512 L828 476 Z" fill="url(#gold)"/>
    <path d="M512 920 L476 828 L512 846 L548 828 Z" fill="url(#gold)"/>
    <path d="M104 512 L196 476 L178 512 L196 548 Z" fill="url(#gold)"/>
    <!-- minor ticks -->
    <g stroke="#F4D27A" stroke-width="10" stroke-linecap="round" stroke-opacity=".85">
      <line x1="737" y1="287" x2="760" y2="264"/><line x1="737" y1="737" x2="760" y2="760"/>
      <line x1="287" y1="737" x2="264" y2="760"/><line x1="287" y1="287" x2="264" y2="264"/>
    </g>
  </g>

  <!-- the capsule is the compass needle -->
  <g transform="translate(512 512) rotate(-45)" filter="url(#drop)">
    <g clip-path="url(#cap)">
      <rect x="-300" y="-92" width="300" height="184" fill="url(#ivory)"/>
      <rect x="0" y="-92" width="300" height="184" fill="url(#red)"/>
      <!-- gloss -->
      <rect x="-270" y="-70" width="540" height="40" rx="20" fill="#fff" opacity=".38"/>
      <!-- seam -->
      <rect x="-7" y="-92" width="14" height="184" fill="url(#gold)"/>
    </g>
    <rect x="-300" y="-92" width="600" height="184" rx="92" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="4"/>
  </g>

  <!-- gold star pivot -->
  <g transform="translate(512 512)" filter="url(#soft)">
    <circle r="66" fill="#0A4F42" stroke="url(#gold)" stroke-width="10"/>
    <path d="M0 -44 L12.9 -17.8 L41.8 -13.6 L20.9 6.8 L25.9 35.6 L0 22 L-25.9 35.6 L-20.9 6.8 L-41.8 -13.6 L-12.9 -17.8 Z" fill="url(#gold)"/>
  </g>
</svg>
